name: Twitch chat

# Inputs (see bot/twitch_chat.py):
#   login        log in the chat account (gremi_bot)
#   login-owner  log in GreMi_Gaming, for ads, giveaway subs, VIPs and the stream title
#   ad / ad 120  run an ad now (only while live)
#   ads          when Twitch's next scheduled ad is due
#   anything else is sent in chat once, right away
# For a login, open the login-code job log and enter the code at twitch.tv/activate
# while logged in to that account. The login is sealed and committed as
# bot/twitch_chat.sealed or bot/twitch_owner.sealed; the bot picks it up by itself.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "login, login-owner, ad, ad 120, ads, rewards, emotes, or a message to send in chat now"
        required: true
        default: login

permissions:
  contents: write

concurrency:
  group: twitch-chat
  cancel-in-progress: false

env:
  TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
  TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
  TWITCH_SCOPES: ${{ inputs.command == 'login-owner' && 'channel:edit:commercial channel:read:ads channel:manage:ads channel:read:subscriptions channel:read:vips channel:manage:broadcast channel:manage:redemptions' || 'user:read:chat user:write:chat' }}
  KIND: ${{ inputs.command == 'login-owner' && 'owner' || 'chat' }}

jobs:
  # Login, step 1: shows the code to enter at twitch.tv/activate (this job's log)
  login-code:
    if: inputs.command == 'login' || inputs.command == 'login-owner'
    runs-on: ubuntu-latest
    outputs:
      device_code: ${{ steps.code.outputs.device_code }}
      interval: ${{ steps.code.outputs.interval }}
      expires_in: ${{ steps.code.outputs.expires_in }}
    steps:
      - uses: actions/checkout@v4
      - id: code
        run: python3 twitch_edit.py login-start

  # Login, step 2: waits for the approval, seals it and commits it for the bot
  login-wait:
    needs: login-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the approval
        env:
          DEVICE_CODE: ${{ needs.login-code.outputs.device_code }}
          INTERVAL: ${{ needs.login-code.outputs.interval }}
          EXPIRES_IN: ${{ needs.login-code.outputs.expires_in }}
          TWITCH_REFRESH_TOKEN_OUT: ${{ runner.temp }}/twitch_chat_token
        run: python3 twitch_edit.py login-finish "$DEVICE_CODE" "$INTERVAL" "$EXPIRES_IN"
      - name: Seal the login and hand it to the bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FILE: ${{ runner.temp }}/twitch_chat_token
        run: |
          python3 -m pip install --quiet "cryptography>=41"
          python3 -m bot.twitch_chat seal "$KIND" "$FILE"
          rm -f "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/twitch_$KIND.sealed
          git commit -m "Twitch $KIND login for Race Control"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

  say:
    if: inputs.command != 'login' && inputs.command != 'login-owner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send the message
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RACE_CONTROL_TWITCH: ${{ runner.temp }}/twitch_chat.json
          MESSAGE: ${{ inputs.command }}
        run: |
          python3 -m pip install --quiet "cryptography>=41" "aiohttp>=3.9"
          case "$MESSAGE" in
            ad|"ad "[0-9]*|ads|rewards|emotes) python3 -m bot.twitch_chat $MESSAGE ;;
            *) python3 -m bot.twitch_chat say "$MESSAGE" ;;
          esac
      - name: Hand a renewed login to the bot
        run: |
          if git diff --quiet bot/; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/twitch_*.sealed
          git commit -qm "Twitch login renewed"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
