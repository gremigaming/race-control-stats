<!doctype html>
<!-- OBS browser source for GreMi's weekly giveaway, served by Race Control at /giveaway.
     Size 540 x 160 (room for the shadow). ?hide=closed hides it between the winner and the next round.
     ?demo plays a short loop (a sub, the 10 minute countdown sped up, the winner) without the server. -->
<html><head><meta charset="utf-8"><title>Giveaway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap">
<style>
  :root { --red: #e10600; --purple: #9146ff; --ink: #fff; --dim: rgba(255,255,255,.62); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Saira Condensed", "Arial Narrow", sans-serif; color: var(--ink); }
  .card { position: relative; display: flex; align-items: center; gap: 18px; width: 488px; margin: 10px 24px 30px;
          padding: 14px 20px; border-radius: 14px; box-sizing: border-box;
          background: linear-gradient(90deg, #460612 0%, #280a5a 100%);
          box-shadow: 0 5px 18px rgba(0,0,0,.45); transition: opacity .4s; isolation: isolate; }
  /* the clip title look: soft light streaks over the red to purple */
  .streaks { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; z-index: -1; }
  .streaks i { position: absolute; top: -20px; bottom: -20px; transform: skewX(-31deg); filter: blur(4px); }
  .streaks i:nth-child(1) { left: -30px; width: 46px; background: rgba(225,6,0,.3); }
  .streaks i:nth-child(2) { left: 58%; width: 70px; background: rgba(145,70,255,.26); }
  .streaks i:nth-child(3) { left: 84%; width: 20px; background: rgba(255,255,255,.1); }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: 14px; padding: 2px;
          background: linear-gradient(90deg, var(--red), var(--purple));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor; mask-composite: exclude; }
  .gift { width: 56px; text-align: center; font-size: 46px; line-height: 1; filter: drop-shadow(0 0 10px rgba(145,70,255,.6)); }
  .label { white-space: nowrap; font-weight: 600; font-size: 17px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  .big { font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  .card > div:last-child { min-width: 0; flex: 1; }
  .row { display: flex; align-items: center; gap: 14px; height: 20px; margin-top: 6px; }
  .pips { display: flex; gap: 6px; }
  .who { white-space: nowrap; font-weight: 600; font-size: 17px; letter-spacing: .06em; color: var(--dim);
         display: flex; align-items: center; gap: 6px; line-height: 1; }
  .who .emo { color: #fff; font-size: 18px; }
  .pip { width: 30px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.16); transition: background .4s; }
  .bar { display: none; width: 174px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
  .bar b { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--red), var(--purple));
           box-shadow: 0 0 8px rgba(145,70,255,.7); transition: width 1s linear; }
  .pip.on { background: linear-gradient(90deg, var(--red), var(--purple)); box-shadow: 0 0 8px rgba(145,70,255,.7); }
  .hidden { opacity: 0; }
  .pop { animation: pop .6s ease; }
  @keyframes pop { 40% { transform: scale(1.06); } }
</style></head>
<body>
<div class="card hidden" id="card">
  <div class="streaks"><i></i><i></i><i></i></div>
  <div class="gift" id="gift">🎁</div>
  <div>
    <div class="label" id="label">Weekly giveaway</div>
    <div class="big" id="big">…</div>
    <div class="row"><div class="pips" id="pips"></div><div class="bar" id="bar"><b id="fill"></b></div><div class="who" id="who"></div></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const hideClosed = q.get("hide") === "closed";
const WIN_SHOW = 300;  // seconds the winner stays on after the draw
let last = null, data = null, offset = 0;
const $ = (id) => document.getElementById(id);

function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function fit() {  // a long winner name gets a smaller font so it fits
  const big = $("big"); let size = 40;
  big.style.fontSize = size + "px";
  while (big.scrollWidth > big.clientWidth + 1 && size > 22) { size -= 2; big.style.fontSize = size + "px"; }
}

function show() {
  if (!data || !data.status) return;
  const now = Date.now() / 1000 + offset;
  const card = $("card");
  let label = "Giveaway · €10 gift card", big = "", who = "", timer = false;
  const n = data.entered || 0, winner = data.winner && now - data.won_at < WIN_SHOW;
  if (data.status === "open") {
    big = data.left === 1 ? "1 sub to go" : data.left + " subs to go";
  } else if (data.status === "drawing") {
    const left = data.draw_at - now;
    label = "Giveaway draw";
    big = left > 0 ? "Draw in " + mmss(left) : "Drawing…";
    timer = true;  // the bar runs down over the 10 minutes
    $("fill").style.width = Math.max(0, Math.min(100, 100 * left / (data.delay || 600))) + "%";
  } else if (winner) {
    label = "Giveaway winner · €10 gift card";
    big = data.winner;
    who = "GG! Next one opens tomorrow";
  } else {
    label = "Giveaway";
    big = "Next one tomorrow";
    if (data.winner) who = "Last winner: " + data.winner;
  }
  $("label").textContent = label;
  $("big").textContent = big;
  fit();
  if (data.status !== "closed") who = "👥 " + n + " entered";
  $("who").textContent = who;
  if (data.status !== "closed") {  // the emoji at full strength, not dimmed with the text
    $("who").innerHTML = '<span class="emo">👥</span><span></span>';
    $("who").lastChild.textContent = n + " entered";
  }
  $("gift").textContent = winner ? "🏆" : "🎁";
  $("pips").style.display = timer || data.status === "closed" ? "none" : "flex";
  $("bar").style.display = timer ? "block" : "none";
  const pips = $("pips");
  if (pips.children.length !== data.need) {
    pips.innerHTML = "";
    for (let i = 0; i < data.need; i++) { const p = document.createElement("div"); p.className = "pip"; pips.appendChild(p); }
  }
  [...pips.children].forEach((p, i) => p.classList.toggle("on", data.status !== "open" || i < data.subs));
  card.classList.toggle("hidden", hideClosed && data.status === "closed" && !winner);
}

function update(d) {
    offset = d.now - Date.now() / 1000;
    const key = d.status + d.subs + "/" + d.entered;
    if (last !== null && key !== last) { $("card").classList.remove("pop"); void $("card").offsetWidth; $("card").classList.add("pop"); }
    last = key; data = d; show();
}

async function poll() {
  try {
    const r = await fetch("giveaway.json", { cache: "no-store" });
    update(await r.json());
  } catch (e) { /* keep showing the last value */ }
}

function demo() {  // a 30 second loop: a sub, the 5th sub starts a 15 second countdown, the winner
  const t0 = Date.now() / 1000, at = (s) => t0 + s;
  const base = { round: 1, need: 5, delay: 15, entered: 12, winner: null, won_at: null };
  const steps = [[0, { status: "open", subs: 3, left: 2 }], [3, { status: "open", subs: 4, left: 1 }],
                 [6, { status: "drawing", subs: 5, left: 0, draw_at: at(21) }],
                 [23, { status: "closed", subs: 5, left: 0, winner: "DemoDriver_27", won_at: at(23) }]];
  last = null;
  steps.forEach(([s, d]) => setTimeout(() => update(Object.assign({}, base, d, { now: Date.now() / 1000 })), s * 1000));
  setTimeout(demo, 30000);
}

if (q.has("demo")) demo(); else { poll(); setInterval(poll, 3000); }
setInterval(show, 1000);
</script>
</body></html>
