name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow (draws the socials board picture)
        run: python3 -m pip install --quiet "pillow>=10,<13"

      - name: Run tests
        run: python3 -m unittest discover -s tests -t . -v
