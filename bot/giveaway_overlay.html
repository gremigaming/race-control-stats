<!doctype html>
<!-- OBS browser source for GreMi's weekly giveaway, served by Race Control at /giveaway.
     Size 540 x 160 (room for the shadow). ?hide=closed hides it between the winner and the next round.
     ?demo plays a short loop (a sub, the 10 minute countdown sped up, the winner) without the server.
     Animations: a sub makes the present jump with "+1 SUB" and confetti; the last 10 seconds pulse;
     the draw shows 3 seconds of "Drawing…", then the winner with a confetti rain and a glow. -->
<html><head><meta charset="utf-8"><title>Giveaway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap">
<style>
  :root { --red: #e10600; --purple: #9146ff; --ink: #fff; --dim: rgba(255,255,255,.62); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Saira Condensed", "Arial Narrow", sans-serif; color: var(--ink); }
  .card { position: relative; display: flex; align-items: center; gap: 18px; width: 488px; margin: 10px 24px 30px;
          padding: 14px 20px; border-radius: 14px; box-sizing: border-box;
          background: linear-gradient(90deg, #460612 0%, #280a5a 100%);
          box-shadow: 0 5px 18px rgba(0,0,0,.45); transition: opacity .4s; isolation: isolate; }
  /* the clip title look: soft light streaks over the red to purple */
  .streaks { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; z-index: -1; }
  .streaks i { position: absolute; top: -20px; bottom: -20px; transform: skewX(-31deg); filter: blur(4px); }
  .streaks i:nth-child(1) { left: -30px; width: 46px; background: rgba(225,6,0,.3); }
  .streaks i:nth-child(2) { left: 58%; width: 70px; background: rgba(145,70,255,.26); }
  .streaks i:nth-child(3) { left: 84%; width: 20px; background: rgba(255,255,255,.1); }
  .streaks i:nth-child(4) { left: -60%; width: 60px; background: rgba(255,255,255,.22); filter: blur(8px); opacity: 0; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: 14px; padding: 2px;
          background: linear-gradient(90deg, var(--red), var(--purple));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor; mask-composite: exclude; }
  .gift { position: relative; width: 56px; text-align: center; font-size: 46px; line-height: 1; filter: drop-shadow(0 0 10px rgba(145,70,255,.6)); }
  .label { white-space: nowrap; font-weight: 600; font-size: 17px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  .big { font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  .card > div:last-child { min-width: 0; flex: 1; }
  .row { display: flex; align-items: center; gap: 14px; height: 20px; margin-top: 6px; }
  .pips { display: flex; gap: 6px; }
  .who { white-space: nowrap; font-weight: 600; font-size: 17px; letter-spacing: .06em; color: var(--dim);
         display: flex; align-items: center; gap: 6px; line-height: 1; }
  .who .emo { width: 20px; height: 20px; fill: #5865f2; flex: none; }
  .pip { width: 30px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.16); transition: background .4s; }
  .bar { display: none; width: 174px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: visible; }
  .bar b { display: block; height: 100%; width: 100%; border-radius: 4px; transition: width 1s linear;
           background: rgba(255,255,255,.78); box-shadow: -2px 0 6px rgba(225,6,0,.4), 2px 0 6px rgba(145,70,255,.45); }
  .pip.on { background: rgba(255,255,255,.78); box-shadow: -2px 0 6px rgba(225,6,0,.4), 2px 0 6px rgba(145,70,255,.45); }
  .hidden { opacity: 0; }
  .pop { animation: pop .6s ease; }
  @keyframes pop { 40% { transform: scale(1.06); } }

  /* animations: a sub, the last 10 seconds, the draw, the winner */
  .big { transform-origin: left center; }
  .plus { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); font-weight: 800; font-size: 22px;
          white-space: nowrap; color: #fff; text-shadow: 0 0 10px var(--purple), 2px 2px 0 #000; opacity: 0; pointer-events: none; }
  .confetti { position: absolute; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; }
  .card.bump { animation: bump .7s ease; }
  .gift.sub { animation: giftsub 1.1s ease; }
  .plus.go { animation: plus 1.6s ease-out; }
  .pip.new { animation: pipflash 1.2s ease; }
  .big.tick { animation: tick .5s ease; }
  .gift.drawing { animation: wobble .5s ease-in-out infinite; }
  .card.win .streaks i:nth-child(4) { animation: sweep 2.4s ease-in-out infinite; }
  .card.win { animation: glow 2s ease-in-out infinite; }
  .gift.trophy { animation: trophy 1s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump { 30% { transform: scale(1.05); } 60% { transform: scale(.98); } }
  @keyframes giftsub {
    0% { transform: scale(1) rotate(0); } 15% { transform: scale(1.35) translateY(-14px) rotate(-14deg); }
    30% { transform: scale(1.35) translateY(-14px) rotate(14deg); } 45% { transform: scale(1.3) translateY(-10px) rotate(-10deg); }
    60% { transform: scale(1.2) translateY(-4px) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes plus { 0% { opacity: 0; transform: translate(-50%, 40px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 6px) scale(1.15); }
    70% { opacity: 1; transform: translate(-50%, -4px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -12px); } }
  @keyframes pipflash { 0%, 50% { background: #fff; box-shadow: 0 0 16px #fff; } }
  @keyframes tick { 30% { transform: scale(1.12); color: #ff5a52; } }
  @keyframes wobble { 0%, 100% { transform: rotate(-10deg) scale(1.05); } 50% { transform: rotate(10deg) scale(1.1); } }
  @keyframes sweep { 0% { left: -60%; opacity: 0; } 20% { opacity: 1; } 60%, 100% { left: 130%; opacity: 0; } }
  @keyframes glow { 50% { box-shadow: 0 5px 18px rgba(0,0,0,.45), 0 0 26px rgba(145,70,255,.75); } }
  @keyframes trophy { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
</style></head>
<body>
<div class="card hidden" id="card">
  <div class="streaks"><i></i><i></i><i></i><i></i></div>
  <div class="gift" id="gift"><span id="icon">🎁</span><div class="plus" id="plus">+1 SUB</div></div>
  <div>
    <div class="label" id="label">Weekly giveaway</div>
    <div class="big" id="big">…</div>
    <div class="row"><div class="pips" id="pips"></div><div class="bar" id="bar"><b id="fill"></b></div><div class="who" id="who"></div></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const hideClosed = q.get("hide") === "closed";
const DISCORD = '<svg class="emo" viewBox="0 0 24 24"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>';
const WIN_SHOW = 300;  // seconds the winner stays on after the draw
const SUSPENSE = 3000; // ms of "Drawing…" before a live winner reveal
let last = null, data = null, offset = 0, revealAt = 0, lastTick = null;
const $ = (id) => document.getElementById(id);

function mmss(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function confetti(n, rain) {  // a burst from the present, or a rain over the whole card
  const box = $("card").getBoundingClientRect(), gb = $("gift").getBoundingClientRect();
  const colors = ["#e10600", "#9146ff", "#ffffff", "#ff5a52", "#c9a7ff"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.background = colors[i % colors.length];
    c.style.left = (rain ? box.left + Math.random() * box.width : gb.left + gb.width / 2) + "px";
    c.style.top = (rain ? box.top + 10 : gb.top + gb.height / 2) + "px";
    document.body.appendChild(c);
    const a = rain ? Math.PI / 2 + (Math.random() - .5) * 1.4 : Math.random() * Math.PI * 2;
    const v = rain ? 40 + Math.random() * 80 : 50 + Math.random() * 70;
    const dx = Math.cos(a) * v * (rain ? .6 : 1), dy = rain ? Math.abs(Math.sin(a)) * v * .5 : -Math.abs(Math.sin(a)) * v;
    c.animate([
      { transform: "translate(0,0) rotate(0)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx * 1.3}px, ${dy + 70}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
    ], { duration: 1400 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => c.remove();
  }
}

function fit() {  // a long winner name gets a smaller font so it fits
  const big = $("big"); let size = 40;
  big.style.fontSize = size + "px";
  while (big.scrollWidth > big.clientWidth + 1 && size > 22) { size -= 2; big.style.fontSize = size + "px"; }
}

function show() {
  if (!data || !data.status) return;
  const now = Date.now() / 1000 + offset;
  const card = $("card");
  let label = "Giveaway · €10 gift card", big = "", who = "", timer = false, drawing = false;
  const suspense = Date.now() < revealAt;
  const n = data.entered || 0, winner = !suspense && data.winner && now - data.won_at < WIN_SHOW;
  if (data.status === "open") {
    big = data.left === 1 ? "1 sub to go" : data.left + " subs to go";
  } else if (data.status === "drawing") {
    const left = data.draw_at - now;
    label = "Giveaway draw";
    big = left > 0 ? "Draw in " + mmss(left) : "Drawing…";
    drawing = left <= 0;
    const sec = Math.ceil(left);
    if (left > 0 && sec <= 10 && sec !== lastTick) { lastTick = sec; restart($("big"), "tick"); }
    timer = true;  // the bar runs down over the 10 minutes
    $("fill").style.width = Math.max(0, Math.min(100, 100 * left / (data.delay || 600))) + "%";
  } else if (suspense) {
    label = "Giveaway draw";
    big = "Drawing…";
    drawing = true;
  } else if (winner) {
    label = "Giveaway winner · €10 gift card";
    big = data.winner;
    who = "GG! Next one opens tomorrow";
  } else {
    label = "Giveaway";
    big = "Next one tomorrow";
    if (data.winner) who = "Last winner: " + data.winner;
  }
  $("label").textContent = label;
  $("big").textContent = big;
  fit();
    $("who").textContent = who;
  if (data.status !== "closed") {  // the Discord logo: people enter on the Discord
    $("who").innerHTML = DISCORD + '<span></span>';
    $("who").lastChild.textContent = n + " entered";
  }
  const icon = winner ? "🏆" : "🎁";
  if ($("icon").textContent !== icon) { $("icon").textContent = icon; if (winner) restart($("gift"), "trophy"); }
  $("gift").classList.toggle("drawing", drawing);
  card.classList.toggle("win", !!winner);
  $("pips").style.display = timer || data.status === "closed" ? "none" : "flex";
  $("bar").style.display = timer ? "block" : "none";
  const pips = $("pips");
  if (pips.children.length !== data.need) {
    pips.innerHTML = "";
    for (let i = 0; i < data.need; i++) { const p = document.createElement("div"); p.className = "pip"; pips.appendChild(p); }
  }
  [...pips.children].forEach((p, i) => p.classList.toggle("on", data.status !== "open" || i < data.subs));
  card.classList.toggle("hidden", hideClosed && data.status === "closed" && !winner && !suspense);
}

function update(d) {  // react to what changed since the last look
  offset = d.now - Date.now() / 1000;
  const prev = last;
  last = data = d;
  show();
  if (!prev) return;
  const subbed = d.round === prev.round && (d.subs > prev.subs || (prev.status === "open" && d.status === "drawing"));
  if (subbed) {  // the present jumps, "+1 SUB", confetti, the new pip flashes
    restart($("card"), "bump"); restart($("gift"), "sub"); restart($("plus"), "go"); confetti(26, false);
    const pip = $("pips").children[Math.min(d.subs, d.need) - 1];
    if (pip) restart(pip, "new");
  } else if (prev.status === "drawing" && d.status === "closed" && d.winner) {  // 3 seconds of suspense, then the winner
    revealAt = Date.now() + SUSPENSE;
    show();
    setTimeout(() => { show(); confetti(60, true); restart($("card"), "bump"); }, SUSPENSE);
  } else if (d.entered !== prev.entered || d.status !== prev.status) {
    restart($("card"), "pop");
  }
}

async function poll() {
  try {
    const r = await fetch("giveaway.json", { cache: "no-store" });
    update(await r.json());
  } catch (e) { /* keep showing the last value */ }
}

function demo() {  // a 30 second loop: a sub, the 5th sub starts a 15 second countdown, the winner
  const t0 = Date.now() / 1000, at = (s) => t0 + s;
  const base = { round: 1, need: 5, delay: 15, entered: 12, winner: null, won_at: null };
  const steps = [[0, { status: "open", subs: 3, left: 2 }], [3, { status: "open", subs: 4, left: 1, entered: 13 }],
                 [6, { status: "drawing", subs: 5, left: 0, draw_at: at(21), entered: 13 }],
                 [23, { status: "closed", subs: 5, left: 0, winner: "DemoDriver_27", won_at: at(23), entered: 13 }]];
  last = null;
  steps.forEach(([s, d]) => setTimeout(() => update(Object.assign({}, base, d, { now: Date.now() / 1000 })), s * 1000));
  setTimeout(demo, 30000);
}

if (q.has("demo")) demo(); else { poll(); setInterval(poll, 3000); }
setInterval(show, 250);
</script>
</body></html>
