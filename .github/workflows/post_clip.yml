name: Post clip

# Sends a finished clip from clip-studio (clips-ready/<clip>) to GreMi's TikTok drafts.
# Nothing goes public: GreMi gets the caption in a Discord DM, adds a sound in TikTok and posts.
# Every morning (around 05:17 Dutch summer time; GitHub often starts it hours late) it sends the oldest
# clip in clip-studio's queue that hasn't been sent yet.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      clip:
        description: "Clip folder name in clips-ready, e.g. singapore-ferrari (next = oldest unsent clip, stats = your latest TikTok numbers)"
        required: true
        default: next

permissions:
  contents: write

# Shares the TikTok login with the stats run, so they never refresh it at the same time
concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send to TikTok drafts
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_REFRESH_TOKEN_OUT: ${{ runner.temp }}/tiktok_refresh_token
          CLIP: ${{ inputs.clip || 'next' }}
        run: python3 post_clip.py "$CLIP"

      # TikTok can hand out a new login token on each use; store it or the next run fails
      - name: Save new TikTok login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          FILE: ${{ runner.temp }}/tiktok_refresh_token
        run: |
          if [ ! -s "$FILE" ]; then exit 0; fi
          gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < "$FILE"
          rm -f "$FILE"
          echo "Saved the new TikTok login."

      # Remember which clips were sent, so the morning run picks a new one
      - name: Save sent clips
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add clips_sent.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Clip sent to TikTok drafts"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && exit 0; sleep $((i * 3)); done
          exit 1
