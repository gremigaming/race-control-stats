<!doctype html>
<!-- OBS browser source for GreMi's weekly giveaway, served by Race Control at /giveaway.
     Size 540 x 160 (room for the shadow and confetti).
     ?hide=closed hides it between the winner reveal and the next round.
     ?demo plays a loop (subs, the 10 minute countdown sped up, the winner) without the server. -->
<html><head><meta charset="utf-8"><title>Giveaway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap">
<style>
  :root { --red: #e10600; --purple: #9146ff; --ink: #fff; --dim: rgba(255,255,255,.7); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Saira Condensed", "Arial Narrow", sans-serif; color: var(--ink); }
  /* the clip title "panel": deep red to deep purple, soft light streaks, red to purple edge */
  .card { position: relative; display: flex; align-items: center; gap: 18px; width: 488px; height: 104px;
          margin: 14px 26px 42px; padding: 0 22px; border-radius: 14px; box-sizing: border-box;
          background: linear-gradient(90deg, rgba(70,6,18,.95), rgba(40,10,90,.95));
          box-shadow: 4px 7px 16px rgba(0,0,0,.55); transition: opacity .4s; isolation: isolate; }
  .streaks { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; z-index: -1; }
  .streaks i { position: absolute; top: -20px; bottom: -20px; transform: skewX(-31deg); filter: blur(4px); }
  .streaks i:nth-child(1) { left: -30px; width: 46px; background: rgba(225,6,0,.3); }
  .streaks i:nth-child(2) { left: 58%; width: 70px; background: rgba(145,70,255,.26); }
  .streaks i:nth-child(3) { left: 84%; width: 20px; background: rgba(255,255,255,.1); }
  .streaks i:nth-child(4) { left: -60%; width: 60px; background: rgba(255,255,255,.22); filter: blur(8px); opacity: 0; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: 14px; padding: 3px;
          background: linear-gradient(90deg, var(--red), var(--purple));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor; mask-composite: exclude; }
  .gift { position: relative; font-size: 50px; line-height: 1; width: 56px; text-align: center;
          filter: drop-shadow(0 0 10px rgba(145,70,255,.7)); }
  .text { min-width: 0; flex: 1; }
  .label { white-space: nowrap; font-weight: 600; font-size: 17px; letter-spacing: .14em; color: var(--dim);
           text-transform: uppercase; text-shadow: 2px 2px 0 rgba(10,0,12,.7); }
  .big { font-weight: 800; font-size: 40px; line-height: 1.02; text-transform: uppercase; letter-spacing: .02em;
         white-space: nowrap; text-shadow: 3px 4px 0 rgba(10,0,12,.8); transform-origin: left center; }
  .row { display: flex; align-items: center; gap: 14px; margin-top: 7px; height: 9px; }
  .pips { display: flex; gap: 6px; }
  .pip { width: 30px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.18); transition: background .4s; }
  .pip.on { background: linear-gradient(90deg, var(--red), var(--purple)); box-shadow: 0 0 8px rgba(145,70,255,.8); }
  .pip.new { animation: pipflash 1.2s ease; }
  .bar { display: none; width: 174px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar b { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--red), var(--purple));
           box-shadow: 0 0 8px rgba(145,70,255,.8); transition: width 1s linear; }
  .who { white-space: nowrap; font-weight: 600; font-size: 17px; letter-spacing: .06em; color: var(--dim);
         text-shadow: 2px 2px 0 rgba(10,0,12,.7); }
  .plus { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); font-weight: 800; font-size: 22px;
          white-space: nowrap; color: #fff; text-shadow: 0 0 10px var(--purple), 2px 2px 0 #000; opacity: 0; pointer-events: none; }
  .confetti { position: absolute; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; }
  .hidden { opacity: 0; }

  /* a sub: the present jumps, shakes and bursts, the new pip flashes */
  .card.bump { animation: bump .7s ease; }
  .gift.sub { animation: giftsub 1.1s ease; }
  .plus.go { animation: plus 1.6s ease-out; }
  /* the countdown: last 10 seconds pulse, then the present wobbles while drawing */
  .big.tick { animation: tick .5s ease; color: #fff; }
  .gift.drawing { animation: wobble .5s ease-in-out infinite; }
  /* the winner: a light sweep over the card and a slow glow */
  .card.win .streaks i:nth-child(4) { animation: sweep 2.4s ease-in-out infinite; }
  .card.win { animation: glow 2s ease-in-out infinite; }
  .gift.trophy { animation: trophy 1s cubic-bezier(.2,1.6,.4,1); }

  @keyframes bump { 30% { transform: scale(1.05); } 60% { transform: scale(.98); } }
  @keyframes giftsub {
    0% { transform: scale(1) rotate(0); } 15% { transform: scale(1.35) translateY(-14px) rotate(-14deg); }
    30% { transform: scale(1.35) translateY(-14px) rotate(14deg); } 45% { transform: scale(1.3) translateY(-10px) rotate(-10deg); }
    60% { transform: scale(1.2) translateY(-4px) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes plus { 0% { opacity: 0; transform: translate(-50%, 40px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 6px) scale(1.15); }
    70% { opacity: 1; transform: translate(-50%, -4px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -12px); } }
  @keyframes pipflash { 0%, 50% { background: #fff; box-shadow: 0 0 16px #fff; } }
  @keyframes tick { 30% { transform: scale(1.12); color: #ff5a52; } }
  @keyframes wobble { 0%, 100% { transform: rotate(-10deg) scale(1.05); } 50% { transform: rotate(10deg) scale(1.1); } }
  @keyframes sweep { 0% { left: -60%; opacity: 0; } 20% { opacity: 1; } 60%, 100% { left: 130%; opacity: 0; } }
  @keyframes glow { 50% { box-shadow: 4px 7px 16px rgba(0,0,0,.55), 0 0 26px rgba(145,70,255,.75); } }
  @keyframes trophy { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
</style></head>
<body>
<div class="card hidden" id="card">
  <div class="streaks"><i></i><i></i><i></i><i></i></div>
  <div class="gift" id="gift"><span id="icon">🎁</span><div class="plus" id="plus">+1 SUB</div></div>
  <div class="text">
    <div class="label" id="label">Weekly giveaway</div>
    <div class="big" id="big">…</div>
    <div class="row"><div class="pips" id="pips"></div><div class="bar" id="bar"><b id="fill"></b></div><div class="who" id="who"></div></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const hideClosed = q.get("hide") === "closed";
const demo = q.has("demo");
const WIN_SHOW = 300;      // seconds the winner stays big after the draw
const SUSPENSE = 3000;     // ms of "Drawing..." before a live winner reveal
let prev = null, data = null, offset = 0, revealAt = 0, lastTick = null;
const $ = (id) => document.getElementById(id);

function mmss(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function confetti(n, spread) {
  const card = $("card"), g = $("gift"), colors = ["#e10600", "#9146ff", "#ffffff", "#ff5a52", "#c9a7ff"];
  const box = card.getBoundingClientRect(), gb = g.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.background = colors[i % colors.length];
    const x0 = spread ? box.left + Math.random() * box.width : gb.left + gb.width / 2;
    const y0 = spread ? box.top + 10 : gb.top + gb.height / 2;
    c.style.left = x0 + "px"; c.style.top = y0 + "px";
    document.body.appendChild(c);
    const a = spread ? Math.PI / 2 + (Math.random() - .5) * 1.4 : Math.random() * Math.PI * 2;
    const v = spread ? 40 + Math.random() * 80 : 50 + Math.random() * 70;
    const dx = Math.cos(a) * v * (spread ? .6 : 1), dy = -Math.abs(Math.sin(a)) * v * (spread ? -.5 : 1);
    c.animate([
      { transform: "translate(0,0) rotate(0)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx * 1.3}px, ${dy + 70}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
    ], { duration: 1400 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => c.remove();
  }
}

function fit() {  // shrink the big line until it fits the card
  const big = $("big"); let size = 40;
  big.style.fontSize = size + "px";
  while (big.scrollWidth > big.clientWidth + 1 && size > 22) { size -= 2; big.style.fontSize = size + "px"; }
}

function show() {
  if (!data || !data.status) return;
  const now = Date.now() / 1000 + offset;
  const card = $("card"), gift = $("gift");
  let label = "Giveaway · €10 gift card", big = "", who = "", icon = "🎁", mode = "pips", win = false, drawing = false;
  const n = data.entered || 0;
  if (data.status === "open") {
    big = data.left === 1 ? "1 sub to go" : data.left + " subs to go";
    who = "👥 " + n + " entered";
  } else if (data.status === "drawing") {
    label = "Giveaway draw · €10 gift card";
    const left = data.draw_at - now;
    mode = "bar";
    $("fill").style.width = Math.max(0, Math.min(100, 100 * left / (data.delay || 600))) + "%";
    who = "👥 " + n + " entered";
    if (left > 0) {
      big = "Draw in " + mmss(left);
      const sec = Math.ceil(left);
      if (sec <= 10 && sec !== lastTick) { lastTick = sec; restart($("big"), "tick"); }
    } else { big = "Drawing…"; drawing = true; }
  } else if (Date.now() < revealAt) {
    label = "Giveaway draw"; big = "Drawing…"; drawing = true; mode = "none";
  } else if (data.winner && now - data.won_at < WIN_SHOW) {
    label = "🏆 Winner · €10 gift card"; big = data.winner; icon = "🏆"; mode = "none"; win = true;
    who = "GG! Next one opens tomorrow";
  } else {
    label = "Giveaway"; big = "Next one tomorrow"; mode = "none";
    who = data.winner ? "Last winner: " + data.winner : "";
  }
  $("label").textContent = label;
  if ($("big").textContent !== big) { $("big").textContent = big; fit(); }
  $("who").textContent = who;
  if ($("icon").textContent !== icon) { $("icon").textContent = icon; if (icon === "🏆") restart(gift, "trophy"); }
  gift.classList.toggle("drawing", drawing);
  card.classList.toggle("win", win);
  const pips = $("pips");
  pips.style.display = mode === "pips" ? "flex" : "none";
  $("bar").style.display = mode === "bar" ? "block" : "none";
  if (pips.children.length !== data.need) {
    pips.innerHTML = "";
    for (let i = 0; i < data.need; i++) { const p = document.createElement("div"); p.className = "pip"; pips.appendChild(p); }
  }
  [...pips.children].forEach((p, i) => p.classList.toggle("on", data.status !== "open" || i < data.subs));
  card.classList.toggle("hidden", hideClosed && data.status === "closed" && !win && !drawing);
}

function update(d) {  // react to what changed since the last look
  offset = d.now - Date.now() / 1000;
  if (prev) {
    const subbed = d.round === prev.round && (d.subs > prev.subs || (prev.status === "open" && d.status === "drawing"));
    if (subbed) {
      restart($("card"), "bump"); restart($("gift"), "sub"); restart($("plus"), "go"); confetti(26, false);
      const p = $("pips").children[Math.min(d.subs, d.need) - 1];
      if (p) restart(p, "new");
    }
    if (prev.status === "drawing" && d.status === "closed" && d.winner) {
      revealAt = Date.now() + SUSPENSE;
      setTimeout(() => { show(); confetti(60, true); restart($("card"), "bump"); }, SUSPENSE);
    }
    if (d.entered !== prev.entered && !subbed) restart($("card"), "bump");
  }
  prev = data = d; show();
}

async function poll() {
  try {
    const r = await fetch("giveaway.json", { cache: "no-store" });
    update(await r.json());
  } catch (e) { /* keep showing the last value */ }
}

function runDemo() {  // a 32 second loop: 2 subs, the 5th starts a sped-up countdown, the winner
  const t0 = Date.now() / 1000;
  const base = { round: 1, need: 5, delay: 15, entered: 12, winner: null, won_at: null };
  const steps = [
    [0, { status: "open", subs: 2 }], [3, { status: "open", subs: 3 }], [6, { status: "open", subs: 4, entered: 13 }],
    [9, { status: "drawing", subs: 5, draw_at: t0 + 24 }],
    [25, { status: "closed", subs: 5, winner: "DemoDriver_27", won_at: t0 + 25 }]
  ];
  let i = 0;
  const go = () => {
    const now = Date.now() / 1000;
    if (now - t0 > 36) return runDemo();
    while (i < steps.length && now - t0 >= steps[i][0]) {
      const s = Object.assign({}, base, steps[i][1], { now, left: 5 - steps[i][1].subs });
      if (i === 0) prev = null;
      update(s); i++;
    }
    if (data) { data.now = now; }
    setTimeout(go, 250);
  };
  go();
}

if (demo) runDemo(); else { poll(); setInterval(poll, 3000); }
setInterval(show, 250);
</script>
</body></html>
