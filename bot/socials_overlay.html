<!doctype html>
<!-- OBS browser source for GreMi's follower and live viewer numbers, served by Race Control at /socials.
     Size 540 x 160 (room for the shadow), same look as the giveaway counter.
     It switches every 30 seconds between FOLLOWERS and WATCHING NOW (only while live somewhere).
     ?every=20 changes the 30 seconds, ?page=followers or ?page=viewers keeps one page,
     ?demo plays a loop with made up numbers (a new follower, the switch) without the server.
     TikTok has no live viewer number (no official API), so WATCHING NOW shows Twitch and YouTube. -->
<html><head><meta charset="utf-8"><title>Socials</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap">
<style>
  :root { --red: #e10600; --purple: #9146ff; --ink: #fff; --dim: rgba(255,255,255,.62); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Saira Condensed", "Arial Narrow", sans-serif; color: var(--ink); }
  .card { position: relative; display: flex; align-items: center; gap: 18px; width: 488px; height: 104px; margin: 10px 24px 30px;
          padding: 14px 20px; border-radius: 14px; box-sizing: border-box;
          background: linear-gradient(90deg, #460612 0%, #280a5a 100%);
          box-shadow: 0 5px 18px rgba(0,0,0,.45); isolation: isolate; }
  /* the clip title look: soft light streaks over the red to purple */
  .streaks { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; z-index: -1; }
  .streaks i { position: absolute; top: -20px; bottom: -20px; transform: skewX(-31deg); filter: blur(4px); }
  .streaks i:nth-child(1) { left: -30px; width: 46px; background: rgba(225,6,0,.3); }
  .streaks i:nth-child(2) { left: 58%; width: 70px; background: rgba(145,70,255,.26); }
  .streaks i:nth-child(3) { left: 84%; width: 20px; background: rgba(255,255,255,.1); }
  .streaks i:nth-child(4) { left: -60%; width: 60px; background: rgba(255,255,255,.22); filter: blur(8px); opacity: 0; }
  .card.switch .streaks i:nth-child(4) { animation: sweep 1.2s ease-in-out; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: 14px; padding: 2px;
          background: linear-gradient(90deg, var(--red), var(--purple));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor; mask-composite: exclude; }

  .icon { position: relative; width: 56px; height: 56px; flex: none; filter: drop-shadow(0 0 10px rgba(145,70,255,.6)); }
  .icon svg { position: absolute; inset: 0; width: 56px; height: 56px; transition: opacity .35s, transform .35s; }
  .icon .off { opacity: 0; transform: scale(.6) rotate(-12deg); }
  .icon .beat { animation: beat 1.1s ease; }
  .main { flex: 1; min-width: 0; }
  .label { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 600; font-size: 17px;
           letter-spacing: .14em; color: var(--dim); text-transform: uppercase; line-height: 1; }
  .label b { color: var(--ink); font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 8px #ff3b30; display: none;
         animation: live 1.4s ease-in-out infinite; }
  .viewers .dot { display: block; }
  .cols { display: flex; gap: 16px; margin-top: 8px; transition: opacity .35s, transform .35s; }
  .cols.out { opacity: 0; transform: translateY(8px); }
  .col { position: relative; flex: 1; min-width: 0; }
  .num { display: flex; align-items: center; gap: 7px; height: 36px; }
  .num svg { width: 22px; height: 22px; fill: #fff; flex: none; opacity: .92; }
  .num span { font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: .02em; white-space: nowrap;
              transform-origin: left center; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; margin-top: 7px; border-radius: 4px; background: rgba(255,255,255,.16); }
  .bar b { display: block; height: 100%; width: 0; border-radius: 4px; transition: width 1.2s ease;
           background: linear-gradient(90deg, #d4464a, #c4509f, #8a6cd0);  /* neon: red, pink, purple with a wide glow (1D) */
           box-shadow: -4px 0 10px rgba(212,70,74,.6), 4px 0 10px rgba(138,108,208,.65), 0 0 22px rgba(196,80,159,.32), 0 0 40px rgba(196,80,159,.12); }
  .plus { position: absolute; left: 30px; top: -6px; font-weight: 800; font-size: 20px; white-space: nowrap; color: #fff;
          text-shadow: 0 0 10px var(--purple), 2px 2px 0 #000; opacity: 0; pointer-events: none; }
  .plus.go { animation: plus 1.6s ease-out; }
  .num span.tick { animation: tick .6s ease; }
  .card.bump { animation: bump .7s ease; }
  @keyframes bump { 30% { transform: scale(1.04); } 60% { transform: scale(.99); } }
  @keyframes beat { 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } 60% { transform: scale(1); } }
  @keyframes plus { 0% { opacity: 0; transform: translateY(26px) scale(.6); } 20% { opacity: 1; transform: translateY(0) scale(1.15); }
    70% { opacity: 1; transform: translateY(-6px) scale(1); } 100% { opacity: 0; transform: translateY(-14px); } }
  @keyframes tick { 30% { transform: scale(1.12); color: #ffd1ec; } }
  @keyframes live { 50% { opacity: .35; box-shadow: none; } }
  @keyframes sweep { 0% { left: -60%; opacity: 0; } 20% { opacity: 1; } 100% { left: 130%; opacity: 0; } }
</style></head>
<body>
<div class="card" id="card">
  <div class="streaks"><i></i><i></i><i></i><i></i></div>
  <div class="icon" id="icon">
    <svg id="heart" viewBox="0 0 24 24"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ff4d57"/><stop offset=".5" stop-color="#e05bb5"/><stop offset="1" stop-color="#9a7cff"/></linearGradient></defs>
      <path fill="url(#g1)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <svg id="eye" class="off" viewBox="0 0 24 24"><defs><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#ff4d57"/><stop offset=".5" stop-color="#e05bb5"/><stop offset="1" stop-color="#9a7cff"/></linearGradient></defs>
      <path fill="url(#g2)" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
  </div>
  <div class="main" id="main">
    <div class="label"><i class="dot"></i><span id="label">Followers</span></div>
    <div class="cols" id="cols"></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const EVERY = Math.max(5, +q.get("every") || 30) * 1000;
const PIN = q.get("page");
const LOGO = {
  twitch: '<svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>'
};
const ORDER = ["twitch", "youtube", "tiktok"];
const $ = (id) => document.getElementById(id);
let data = null, page = PIN === "viewers" ? "viewers" : "followers", shown = {}, drawn = "";

function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function live() { return data && Object.keys(data.viewers || {}).length > 0; }

function fit(el) {  // a long number gets a smaller font so the columns never touch
  const col = el.closest(".col"); let size = 36;
  el.style.fontSize = size + "px";
  while (el.parentNode.scrollWidth > col.clientWidth + 1 && size > 22) { size -= 2; el.style.fontSize = size + "px"; }
}

function countTo(el, from, to) {  // numbers roll to the new value
  const t0 = performance.now(), ms = 900;
  el.textContent = fmt(to); fit(el);
  const step = (t) => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function draw(animate) {
  if (!data) return;
  const nums = data[page] || {};
  const keys = ORDER.filter((k) => nums[k] !== undefined);
  const sig = page + ":" + keys.join(",");
  const cols = $("cols");
  if (sig !== drawn) {  // build the columns for this page
    drawn = sig; shown = {};
    cols.innerHTML = keys.map((k) => `<div class="col" data-k="${k}"><div class="plus">+1</div>
      <div class="num">${LOGO[k]}<span>0</span></div><div class="bar"><b></b></div></div>`).join("");
  }
  const total = keys.reduce((s, k) => s + nums[k], 0), top = Math.max(1, ...keys.map((k) => nums[k]));
  $("label").innerHTML = page === "viewers" ? "Watching now" : "Followers · <b>" + fmt(total) + "</b>";
  document.body.classList.toggle("viewers", page === "viewers");
  for (const k of keys) {
    const col = cols.querySelector(`[data-k="${k}"]`), span = col.querySelector(".num span"), v = nums[k];
    if (shown[k] === undefined) countTo(span, 0, v);
    else if (shown[k] !== v) {
      countTo(span, shown[k], v); restart(span, "tick");
      if (page === "followers" && v > shown[k] && animate) {  // a new follower: "+1", the heart beats
        const plus = col.querySelector(".plus"); plus.textContent = "+" + (v - shown[k]);
        restart(plus, "go"); restart($("card"), "bump"); restart($("heart"), "beat");
      }
    }
    shown[k] = v;
    requestAnimationFrame(() => { col.querySelector(".bar b").style.width = Math.max(4, 100 * v / top) + "%"; });
  }
}

function setPage(next) {
  if (next === page) return;
  $("cols").classList.add("out");
  setTimeout(() => {
    page = next; drawn = "";
    $("heart").classList.toggle("off", page !== "followers");
    $("eye").classList.toggle("off", page !== "viewers");
    restart($("card"), "switch");
    draw(false);
    $("cols").classList.remove("out");
  }, 350);
}

function cycle() {
  if (PIN) setPage(PIN === "viewers" && live() ? "viewers" : "followers");
  else setPage(page === "followers" && live() ? "viewers" : "followers");
}

function update(d) {
  data = d;
  if (page === "viewers" && !live()) setPage("followers");
  draw(true);
}

async function poll() {
  try {
    const r = await fetch("socials.json", { cache: "no-store" });
    update(await r.json());
  } catch (e) { /* keep showing the last numbers */ }
}

function demo() {  // made up numbers: a new follower after 4 s, live viewers rise a bit
  let f = { twitch: 1645, youtube: 2700, tiktok: 3942 }, v = { twitch: 12, youtube: 12 }, n = 0;
  const tickDemo = () => {
    n++;
    if (n === 2) f = Object.assign({}, f, { twitch: f.twitch + 1 });
    if (n === 5) f = Object.assign({}, f, { tiktok: f.tiktok + 2 });
    v = { twitch: v.twitch + (n % 3 === 0 ? 1 : 0), youtube: v.youtube + (n % 4 === 0 ? 2 : 0) };
    update({ followers: f, viewers: v });
  };
  tickDemo(); setInterval(tickDemo, 2000);
}

$("heart").classList.toggle("off", page !== "followers");
$("eye").classList.toggle("off", page !== "viewers");
if (q.has("demo")) demo(); else { poll(); setInterval(poll, 10000); }
setInterval(cycle, q.has("demo") && !q.get("every") ? 8000 : EVERY);
</script>
</body></html>
