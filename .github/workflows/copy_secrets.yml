name: Copy secrets to clip-studio
on: workflow_dispatch
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          for n in GH_SECRETS_TOKEN DISCORD_BOT_TOKEN TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET TIKTOK_REFRESH_TOKEN; do
            if [ -z "${!n}" ]; then echo "::error::$n is empty"; exit 1; fi
            printf '%s' "${!n}" | gh secret set "$n" --repo gremigaming/clip-studio
            echo "copied $n"
          done
