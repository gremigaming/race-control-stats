name: Update stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      post_socials_board:
        description: "Post the socials board if it isn't in the Socials channel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow (draws the socials board picture)
        run: python3 -m pip install --quiet "pillow>=10,<13" || echo "Pillow install failed, the socials board will be skipped"

      - name: Update stat channels
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Real GreMi_Gaming server (switched from the test server 2026-10-06)
          GUILD_ID: "1079917337165172876"
          # Socials channel, where the socials board lives (socials_board.py)
          SOCIALS_CHANNEL_ID: "1083312808759926844"
          SOCIALS_BOARD_POST: ${{ inputs.post_socials_board && 'true' || '' }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_LOGIN: ${{ secrets.TWITCH_LOGIN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_REFRESH_TOKEN_OUT: ${{ runner.temp }}/tiktok_refresh_token
        run: python3 update_stats.py

      # TikTok can hand out a new login token on each run; store it or the next run fails
      - name: Save new TikTok login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          FILE: ${{ runner.temp }}/tiktok_refresh_token
        run: |
          if [ ! -s "$FILE" ]; then exit 0; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "TikTok changed its login token but GH_SECRETS_TOKEN is missing, so it can't be saved."
            rm -f "$FILE"; exit 1
          fi
          gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < "$FILE"
          rm -f "$FILE"
          echo "Saved the new TikTok login."

      - name: Keep the schedule alive
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%F > .keepalive
            if [ -n "$(git status --porcelain .keepalive)" ]; then
              git config user.name "github-actions"
              git config user.email "github-actions@users.noreply.github.com"
              git add .keepalive
              git commit -m "Monthly keepalive"
              git push
            fi
          fi
