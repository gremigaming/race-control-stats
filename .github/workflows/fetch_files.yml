name: Fetch files

# Downloads a public Google Drive folder (for example partner images) so Claude
# can look through it: the files come back as a run artifact, nothing is committed.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public Google Drive folder link"
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the folder
        env:
          URL: ${{ inputs.url }}
        run: |
          python3 -m pip install --quiet "gdown>=5" pillow
          mkdir -p files
          gdown --folder -O files "$URL"
          find files -type f | sort
      - name: Contact sheet and sizes
        run: |
          python3 - <<'PY'
          import pathlib
          from PIL import Image
          for p in sorted(pathlib.Path("files").rglob("*")):
              if p.is_file():
                  try:
                      im = Image.open(p)
                      alpha = im.mode in ("RGBA", "LA") or "transparency" in im.info
                      print(f"{p}  {im.size[0]}x{im.size[1]}  {im.mode}  transparent={alpha}")
                  except Exception:
                      print(f"{p}  (not an image)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: files
          path: files
          retention-days: 3
