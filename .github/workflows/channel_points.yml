name: Channel points kit

# Builds Documents\GreMiChannelPoints for GreMi's PC (see channel_points/):
#   wordban.exe + wordban\model   offline word ban listener (Vosk)
#   alerts.html                   OBS browser source for the reward alerts
#   sounds\*.wav                  reward sounds (made by make_sounds.py)
# and checks that the Streamer.bot inline C# compiles and the listener hears a test word.
# Output: GreMiChannelPoints.zip on the release "channel-points-kit" (and the run's artifact).

on:
  workflow_dispatch:
  push:
    paths: ["channel_points/**", ".github/workflows/channel_points.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Streamer.bot C# compiles
        shell: pwsh
        run: |
          dotnet new classlib -o $env:RUNNER_TEMP\cs -f net8.0 --force | Out-Null
          dotnet add $env:RUNNER_TEMP\cs package Newtonsoft.Json | Out-Null
          Remove-Item $env:RUNNER_TEMP\cs\Class1.cs
          Copy-Item channel_points\ci\Stub.cs $env:RUNNER_TEMP\cs\
          foreach ($f in Get-ChildItem channel_points\streamerbot\*.cs) {
            (Get-Content $f.FullName -Raw) -replace 'public class CPHInline', 'public class CPHInline : StubBase' |
              Set-Content $env:RUNNER_TEMP\cs\Inline.cs
            dotnet build $env:RUNNER_TEMP\cs -nologo -v q -warnaserror:CS0103
            if ($LASTEXITCODE) { throw "$($f.Name) does not compile" }
            Write-Host "$($f.Name) compiles"
          }
      - name: Build the listener
        shell: pwsh
        run: |
          python -m pip install --quiet vosk sounddevice websocket-client pyinstaller
          $kit = "dist\GreMiChannelPoints"
          New-Item -ItemType Directory -Force "$kit\wordban", "$kit\sounds" | Out-Null
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -OutFile model.zip
          Expand-Archive model.zip -DestinationPath model-tmp
          Move-Item model-tmp\vosk-model-small-en-us-0.15 "$kit\wordban\model"
          pyinstaller --onefile --noconsole --name wordban --collect-all vosk --distpath $kit channel_points\wordban\listener.py
          python channel_points\make_sounds.py "$kit\sounds"
          Copy-Item channel_points\alerts.html $kit
          Copy-Item channel_points\wordban\listener.py "$kit\wordban\listener.py.txt"
      - name: Listener hears a test word
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $s.SetOutputToWaveFile("$pwd\test.wav", $fmt)
          $s.Speak("Alright, that lap was okay. Honestly it is totally okay, I think.")
          $s.Dispose()
          $kit = "dist\GreMiChannelPoints"
          $p = Start-Process "$kit\wordban.exe" -ArgumentList "--wav", "$pwd\test.wav", "okay" -PassThru -Wait
          $r = Get-Content "$pwd\test.wav.json" -Raw | ConvertFrom-Json
          Write-Host "heard: $($r.text) / hits: $($r.hits)"
          if ($r.hits -lt 1) { throw "the listener did not hear 'okay'" }
          Remove-Item "$kit\wordban\listener.log" -ErrorAction SilentlyContinue
      - name: Publish as release asset (GreMi's PC downloads it from there)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\GreMiChannelPoints\* -DestinationPath GreMiChannelPoints.zip -Force
          gh release view channel-points-kit 2>$null
          if ($LASTEXITCODE) { gh release create channel-points-kit --title "Channel points kit" --notes "Built by channel_points.yml. Unzip into Documents\GreMiChannelPoints." --target $env:GITHUB_SHA }
          gh release upload channel-points-kit GreMiChannelPoints.zip --clobber
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: GreMiChannelPoints
          path: dist/GreMiChannelPoints
          retention-days: 30
